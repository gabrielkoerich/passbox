name = "things3"
description = "Things 3 todos, through the things CLI"

[[tool]]
name = "add"
description = "Add a todo, with an optional notes body"
mode = "always"
params = ["title", "notes?"]
run = ["things", "add", "--notes", "{notes}", "--", "{title}"]

[[tool]]
name = "inbox"
description = "List inbox todos"
mode = "window"
params = []
run = ["things", "inbox"]

[[tool]]
name = "today"
description = "List today's todos"
mode = "window"
params = []
run = ["things", "today"]

[[tool]]
name = "search"
description = "Search todos for a query"
mode = "window"
params = ["query"]
run = ["things", "search", "--", "{query}"]
