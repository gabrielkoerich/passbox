name = "gh"
description = "Gated GitHub pull request and issue creation, in the current repository"
version = "1.0.0"
requires = "gh"
install = "brew install gh"
cwd = "caller"

[[tool]]
name = "pr"
description = "Open a pull request from the current branch"
mode = "always"
params = ["title", "body?"]
run = ["gh", "pr", "create", "--title", "{title}", "--body", "{body}"]

[[tool]]
name = "issue"
description = "Open an issue"
mode = "always"
params = ["title", "body?"]
run = ["gh", "issue", "create", "--title", "{title}", "--body", "{body}"]
