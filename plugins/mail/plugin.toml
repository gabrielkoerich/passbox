name = "mail"
description = "Apple Mail: read and search"
version = "2.0.0"

[[tool]]
name = "recent"
readonly = true
description = "Most recent inbox messages: date, sender, subject"
params = ["count?"]
run = ["osascript", "recent.applescript", "{count}"]

[[tool]]
name = "search"
readonly = true
description = "Search inbox subjects for a query"
params = ["query"]
run = ["osascript", "search.applescript", "{query}"]
