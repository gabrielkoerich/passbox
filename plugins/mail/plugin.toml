name = "mail"
description = "Apple Mail: read and search"
version = "2.0.1"

[[tool]]
name = "recent"
readonly = true
description = "Most recent inbox messages: date, sender, subject"
params = ["count?"]
run = ["osascript", "recent.applescript", "{count}"]

[[tool]]
name = "search"
readonly = true
description = "Search subjects and senders in every mailbox for a query, up to 50, each with its mailbox"
params = ["query"]
run = ["osascript", "search.applescript", "{query}"]
