# The Xcode project is generated from this file, so there is no .xcodeproj to merge or to break:
#   brew install xcodegen && xcodegen && open Passbox.xcodeproj
name: Passbox
options:
  bundleIdPrefix: com.gabrielkoerich
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  PassboxCore:
    path: Core

targets:
  Passbox:
    type: application
    platform: iOS
    sources:
      - App
    dependencies:
      - package: PassboxCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gabrielkoerich.passbox.phone
        PRODUCT_NAME: passbox
        # The team that signs the Mac binary. Change it to build under another account
        DEVELOPMENT_TEAM: ZEY9Z684DK
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # No Info.plist file: these settings are the whole of it
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: passbox
        INFOPLIST_KEY_NSFaceIDUsageDescription: Face ID confirms it is you before this phone approves a request from your Mac.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
