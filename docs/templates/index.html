{% extends "base.html" %}

{% block content %}
<div id="intro">
    <em>{{config.description}}</em>
</div>

<h2>Documentation</h2>
<ul>
    {% for page in section.pages %}
    <li><a href="{{page.permalink | safe}}">{{page.title}}</a>{% if page.description %} — <span style="color: var(--text-secondary);">{{page.description}}</span>{% endif %}</li>
    {% endfor %}
</ul>

{% endblock %}
