base_url = "https://passbox.gabrielkoerich.com"
theme = "zola-docs"
compile_sass = true
build_search_index = false
title = "passbox"
description = "A password manager for agents. A fingerprint releases one secret into one process."
default_language = "en"
minify_html = true

[markdown]
render_emoji = true
[markdown.highlighting]
# Class based, so the palette ships as one stylesheet rather than inline colours on every span
style = "class"
theme = "github-dark"
add_color_scheme = true

[extra]
author = "Gabriel Koerich"
site_name = "passbox"
home_url = "https://gabrielkoerich.com"
github = "https://github.com/gabrielkoerich/passbox"
stylesheet = "main.css"
nav = [
    { name = "Docs", url = "@/_index.md" },
    { name = "Releases", url = "https://github.com/gabrielkoerich/passbox/releases" },
]
