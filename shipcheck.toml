runner = "host"
on = ["push", "commit"]

# Only checks that read the tree run on this Mac. Anything that builds or runs passbox, build.rs included, runs in a
# Colima VM, since a test or a build script on the host would touch the real store, keychain and Secure Enclave
[host]
versions = ["cargo --version", "gitleaks version"]

[host.checks]
fmt = "cargo fmt --check"
gitleaks = "d=$(mktemp -d \"$HOME/scan.XXXXXX\") && git archive HEAD | tar -x -C \"$d\" && gitleaks dir --redact --no-banner \"$d\""

# ci.yml's Linux jobs as on GitHub: clippy, the test with age installed, and examples, which starts Docker
[jobs."ci.yml/clippy"]
runner = "act"
engine = "colima"

[jobs."ci.yml/test"]
runner = "act"
engine = "colima"

[jobs."ci.yml/examples"]
runner = "act"
engine = "colima"
