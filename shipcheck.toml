runner = "host"
on = ["push", "commit"]

[host]
versions = ["cargo --version", "rustc --version", "swiftc --version", "gitleaks version"]

[host.checks]
fmt = "cargo fmt --check"
gitleaks = "d=$(mktemp -d \"$HOME/scan.XXXXXX\") && git archive HEAD | tar -x -C \"$d\" && gitleaks dir --redact --no-banner \"$d\""
# build.rs compiles the Swift Secure Enclave helper, its module cache goes to the sandbox's TMPDIR
clippy = "CLANG_MODULE_CACHE_PATH=\"$TMPDIR/clang-module-cache\" cargo clippy --all-targets -- -D warnings"
test-macos = "CLANG_MODULE_CACHE_PATH=\"$TMPDIR/clang-module-cache\" cargo test --features mock-enclave"

# the Linux test as on GitHub, with age installed, and examples, which starts Docker, both in a Colima VM
[jobs."ci.yml/test"]
runner = "act"
engine = "colima"

[jobs."ci.yml/examples"]
runner = "act"
engine = "colima"
