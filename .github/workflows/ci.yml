name: CI

on:
  push:
  workflow_dispatch: {}

permissions:
  contents: write

# A newer push replaces the run in progress, so two runs never wait on a runner together
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Format
        run: cargo fmt --check

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # The binary rather than the action, which builds its own commit range and cannot
      # scan a repository's first push, where that range starts before the root commit
      - name: Gitleaks
        env:
          VERSION: 8.24.3
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /tmp gitleaks
          /tmp/gitleaks dir . --config .gitleaks.toml --no-banner --redact --exit-code=1

  # Every check runs on Linux. The host build compiles there with the test fake in place of the
  # Enclave, and macOS runs only the release build, after all of this has passed
  clippy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-all-crates: true
      # The client build is what a Linux box runs, the host build is the Mac's
      - name: Clippy
        run: |
          cargo clippy --no-default-features -- -D warnings
          cargo clippy --all-targets -- -D warnings
          cargo clippy --all-targets --features mock-enclave -- -D warnings

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # A broken headless check then fails the job instead of reaching for an Enclave
    env:
      PASSBOX_NO_ENCLAVE: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-all-crates: true

      # The reference implementation, so the interop test runs rather than skipping
      - name: Install age
        run: sudo apt-get update -q && sudo apt-get install -yq age

      # The fake enclave runs the broker tests that would otherwise need a finger
      - name: Test
        run: cargo test --features mock-enclave

  # Every example and integration runs against the client build and a throwaway passphrase store,
  # so none needs a Mac
  examples:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable

      # The Rust example is its own Cargo project with its own target, so it is cached separately
      - uses: Swatinem/rust-cache@v2
        with:
          cache-all-crates: true
          workspaces: |
            . -> target
            examples/rust -> target

      - name: Build the client
        run: |
          cargo build --no-default-features
          echo "$PWD/target/debug" >> "$GITHUB_PATH"

      - name: Python
        working-directory: examples
        run: python3 python/passbox.py

      - name: MCP
        working-directory: examples
        run: python3 mcp/passbox_mcp.py

      # The parts that need no mail server: attachment names, header decoding, the pin
      - name: IMAP plugin
        run: python3 -I plugins/imap/selfcheck.py

      - name: TypeScript
        working-directory: examples
        run: npx --yes tsx typescript/selfcheck.ts

      - name: Rust
        working-directory: examples
        run: cargo run --manifest-path rust/Cargo.toml

      # The copy half needs a Mac pasteboard, so this checks the workflow file and the listing Alfred shows
      - name: Alfred integration
        working-directory: integrations/alfred
        run: |
          python3 -c 'import plistlib; plistlib.load(open("info.plist", "rb"))'
          export PASSBOX_DIR="$RUNNER_TEMP/alfred" PASSBOX_PASSPHRASE="correct horse battery staple"
          passbox init
          printf 'v' | passbox add github/token
          printf 'v' | passbox add db/password
          # list.sh hands the names to filter.sh as an Alfred variable, so this replays that handoff
          PASSBOX="$(command -v passbox)" ./list.sh > "$RUNNER_TEMP/list.json"
          names=$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1]))["alfredworkflow"]["variables"]["names"])' "$RUNNER_TEMP/list.json")
          names="$names" ./filter.sh > "$RUNNER_TEMP/alfred.json"
          python3 -c 'import json, sys; d = json.load(open(sys.argv[1])); assert sorted(i["title"] for i in d["items"]) == ["db/password", "github/token"], d' "$RUNNER_TEMP/alfred.json"
          error="denied" ./filter.sh | grep -q '"passbox ls failed"'
          # The same package the release attaches
          ./build.sh 0.0.0 "$RUNNER_TEMP/passbox.alfredworkflow"
          unzip -Z1 "$RUNNER_TEMP/passbox.alfredworkflow" | sort | tr '\n' ' ' | grep -qx 'copy.sh filter.sh icon.png info.plist list.sh '
          # Alfred shows a broken icon without an error, so check every chunk and the 512 square
          python3 - "$RUNNER_TEMP/passbox.alfredworkflow" <<'PY'
          import struct, sys, zipfile, zlib
          png = zipfile.ZipFile(sys.argv[1]).read("icon.png")
          assert png[:8] == b"\x89PNG\r\n\x1a\n", "icon.png is not a PNG"
          at, chunks, idat = 8, [], b""
          while at < len(png):
              (size,) = struct.unpack(">I", png[at : at + 4])
              kind, body = png[at + 4 : at + 8], png[at + 8 : at + 8 + size]
              (crc,) = struct.unpack(">I", png[at + 8 + size : at + 12 + size])
              assert zlib.crc32(kind + body) == crc, f"bad CRC in {kind}"
              chunks.append((kind, body))
              idat += body if kind == b"IDAT" else b""
              at += 12 + size
          assert chunks[0][0] == b"IHDR" and chunks[-1][0] == b"IEND", [k for k, _ in chunks]
          size = struct.unpack(">II", chunks[0][1][:8])
          assert size == (512, 512), f"icon.png is {size}, want 512x512"
          zlib.decompress(idat)
          PY

      # GitHub's runner image has shellcheck, act's does not
      - name: Shellcheck the example scripts
        run: |
          command -v shellcheck >/dev/null || { sudo apt-get update -q && sudo apt-get install -yq shellcheck; }
          shellcheck examples/linux-client/*.sh integrations/alfred/*.sh app/*.sh

      # The Linux client needs a Mac and a tailnet to run, so CI checks that the image builds and starts
      # the client built above, which is what the next release ships. Its other layers stay cached
      - name: Put the client in the image context
        run: cp target/debug/passbox examples/linux-client/passbox
      - uses: docker/setup-buildx-action@v4
      - name: Build the Linux client image
        uses: docker/build-push-action@v7
        with:
          context: examples/linux-client
          load: true
          tags: passbox-client
          cache-from: type=gha,scope=linux-client
          cache-to: type=gha,mode=max,scope=linux-client
      - name: The image runs this commit's client
        run: |
          want=$(target/debug/passbox --version)
          got=$(docker run --rm --entrypoint passbox passbox-client --version)
          [ "$got" = "$want" ] || { echo "::error::image has $got, built $want"; exit 1; }

  # Launching the menu-bar app would ask for a listing, so CI checks its filter and that it bundles
  app:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Search filter
        run: swift run --package-path app SearchCheck
      - name: Build the Mac app
        run: |
          app/build.sh 0.0.0 "$RUNNER_TEMP/passbox.app"
          codesign --verify --strict "$RUNNER_TEMP/passbox.app"
          [ "$(plutil -extract CFBundleShortVersionString raw "$RUNNER_TEMP/passbox.app/Contents/Info.plist")" = 0.0.0 ]

  # The version has to be known before the binaries build, or every release ships a
  # binary stamped with the previous number.
  version:
    needs: [lint, gitleaks, clippy, test, examples, app]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: release
      cancel-in-progress: false
    outputs:
      version: ${{ steps.version.outputs.version }}
      skip: ${{ steps.check.outputs.skip }}
      last_tag: ${{ steps.check.outputs.last_tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check for new commits since last tag
        id: check
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          echo "last_tag=$LAST_TAG" >> "$GITHUB_OUTPUT"

          if [ -n "$LAST_TAG" ]; then
            COMMIT_COUNT=$(git rev-list "$LAST_TAG"..HEAD --count)
          else
            COMMIT_COUNT=$(git rev-list HEAD --count)
          fi

          if [ "$COMMIT_COUNT" -eq 0 ]; then
            echo "No new commits since $LAST_TAG, skipping release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -n "$LAST_TAG" ]; then
            SUBJECTS=$(git log "$LAST_TAG"..HEAD --pretty=format:"%s")
          else
            SUBJECTS=$(git log --pretty=format:"%s")
          fi
          NON_CHORE=$(echo "$SUBJECTS" | grep -cvE '^chore(\(.*\))?:' || true)
          if [ "$NON_CHORE" -eq 0 ]; then
            echo "All $COMMIT_COUNT commits are chore, skipping release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "$COMMIT_COUNT new commits since ${LAST_TAG:-beginning} ($NON_CHORE non-chore)"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Determine version bump from conventional commits
        # Inside this job the answer comes from the step above, not from the job's own output
        if: steps.check.outputs.skip == 'false'
        id: version
        env:
          LAST_TAG: ${{ steps.check.outputs.last_tag }}
        run: |
          if [ -n "$LAST_TAG" ]; then
            COMMITS=$(git log "$LAST_TAG"..HEAD --pretty=format:"%s")
          else
            COMMITS=$(git log --pretty=format:"%s")
          fi

          BUMP="patch"
          if echo "$COMMITS" | grep -qiE '^(feat|refactor)(\(.*\))?!?:'; then
            BUMP="minor"
          fi

          # A breaking change is the conventional-commits `!` marker or a BREAKING CHANGE footer,
          # never the word "breaking" in prose, which any commit mentioning it would trip
          HAS_BREAKING=false
          if echo "$COMMITS" | grep -qE '^[a-z]+(\(.*\))?!:'; then
            HAS_BREAKING=true
          fi
          if [ -n "$LAST_TAG" ] && git log "$LAST_TAG"..HEAD --pretty=format:"%b" | grep -qE '^BREAKING[ -]CHANGE:'; then
            HAS_BREAKING=true
          fi
          if [ "$HAS_BREAKING" = true ]; then
            BUMP="major"
          fi

          if [ -z "$LAST_TAG" ]; then
            NEW_VERSION="v0.1.0"
          else
            CURRENT="${LAST_TAG#v}"
            IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
            case "$BUMP" in
              major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
              minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
              patch) PATCH=$((PATCH + 1)) ;;
            esac
            NEW_VERSION="v${MAJOR}.${MINOR}.${PATCH}"
          fi

          # A run that tagged and then lost its push leaves a tag that `describe` cannot see,
          # so skip past anything already taken rather than failing on the collision
          while git rev-parse "$NEW_VERSION" >/dev/null 2>&1; do
            CURRENT="${NEW_VERSION#v}"
            IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
            NEW_VERSION="v${MAJOR}.${MINOR}.$((PATCH + 1))"
            echo "tag was taken, trying $NEW_VERSION"
          done

          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $NEW_VERSION (${BUMP} bump)"

  # CI pays the build cost once so nobody installing has to. Public repos get free minutes.
  binaries:
    needs: [lint, gitleaks, clippy, test, examples, app, version]
    if: github.ref == 'refs/heads/main' && needs.version.outputs.skip == 'false'
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            features: ""
          # musl, statically linked. A gnu build inherits the runner's glibc floor, which
          # made the 0.13 binaries refuse to start on Debian 12 and Ubuntu 22.04.
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            features: "--no-default-features"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
        with:
          cache-all-crates: true
          key: ${{ matrix.target }}

      # Stamped before the build, so `passbox --version` is the version it ships as
      - name: Install the musl toolchain
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Stamp the version
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          # An empty version silently writes `version = ""`, which fails much further along
          [ -n "$VERSION" ] || { echo "::error::the version job produced no version"; exit 1; }
          # python rather than sed, because BSD `sed -i` takes a backup suffix and GNU does not
          python3 - "${VERSION#v}" <<'PY'
          import re, sys
          v = sys.argv[1]
          t = open("Cargo.toml").read()
          t = re.sub(r'^version = .*$', f'version = "{v}"', t, count=1, flags=re.M)
          open("Cargo.toml", "w").write(t)
          l = open("Cargo.lock").read()
          l = re.sub(r'(^name = "passbox"\n)version = .*$',
                     lambda m: m.group(1) + f'version = "{v}"', l, count=1, flags=re.M)
          open("Cargo.lock", "w").write(l)
          PY
          grep -m1 '^version' Cargo.toml

      # A second implementation opening what CryptoKit sealed is the evidence that the
      # construction is standard. Wrapping uses only a public key, so no Enclave is involved.
      - name: Cross-check the Secure Enclave ECIES against an independent implementation
        if: runner.os == 'macOS'
        run: |
          swiftc -O -o /tmp/passbox-se swift/passbox-se.swift
          python3 -m venv /tmp/venv
          /tmp/venv/bin/pip install --quiet cryptography
          /tmp/venv/bin/python tests/ecies.py /tmp/passbox-se

      - name: Build
        env:
          TARGET: ${{ matrix.target }}
          FEATURES: ${{ matrix.features }}
        run: |
          rustup target add "$TARGET"
          # shellcheck disable=SC2086
          cargo build --release --locked --target "$TARGET" $FEATURES
          # The hardened runtime stops a same-user debugger reading the broker's memory
          if [[ "$TARGET" == *apple-darwin ]]; then
            codesign -s - --force --options runtime "target/$TARGET/release/passbox"
            codesign -dv "target/$TARGET/release/passbox" 2>&1 | tee sig.txt
            grep -q "runtime" sig.txt
            # Ad hoc, so the binary needs no developer identity
            grep -q "Signature=adhoc" sig.txt
          fi
          # The mock enclave must never ship, whatever this build was configured with. Only the
          # gated code holds that name, and a mock build aborts outside a cargo target directory
          bin="target/$TARGET/release/passbox"
          if grep -aq PASSBOX_SE_HELPER "$bin"; then
            echo "::error::the mock enclave is in a release binary"
            exit 1
          fi
          outside=$(mktemp -d) && cp "$bin" "$outside/" && "$outside/passbox" --version
          tar -czf "passbox-$TARGET.tar.gz" -C "target/$TARGET/release" passbox

      - uses: actions/upload-artifact@v7
        with:
          name: passbox-${{ matrix.target }}
          path: passbox-${{ matrix.target }}.tar.gz
          retention-days: 1

  release:
    needs: [lint, gitleaks, clippy, test, examples, app, version, binaries]
    if: github.ref == 'refs/heads/main' && needs.version.outputs.skip == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Starts pages.yml, which a release made with GITHUB_TOKEN would not trigger
      actions: write
    # Two pushes close together raced and both computed the same next tag. Queue instead.
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Generate changelog
        if: needs.version.outputs.skip == 'false'
        id: changelog
        env:
          LAST_TAG: ${{ needs.version.outputs.last_tag }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          if [ -n "$LAST_TAG" ]; then
            RAW=$(git log "$LAST_TAG"..HEAD --pretty=format:"%s|%h")
          else
            RAW=$(git log --pretty=format:"%s|%h")
          fi

          BREAKING=""
          FEATURES=""
          FIXES=""
          OTHER=""

          while IFS='|' read -r msg hash; do
            [ -n "$msg" ] || continue
            entry="- ${msg} (${hash})"
            if echo "$msg" | grep -qE '^[a-z]+(\(.*\))?!:'; then
              BREAKING+="${entry}"$'\n'
            elif echo "$msg" | grep -qiE '^feat(\(.*\))?!?:'; then
              FEATURES+="${entry}"$'\n'
            elif echo "$msg" | grep -qiE '\bfix(ed|es)?\b|\bbug\b|\bhotfix\b'; then
              FIXES+="${entry}"$'\n'
            else
              OTHER+="${entry}"$'\n'
            fi
          done <<< "$RAW"

          CHANGELOG="## ${VERSION}"$'\n\n'
          [ -n "$BREAKING" ] && CHANGELOG+="### Breaking Changes"$'\n'"${BREAKING}"$'\n'
          [ -n "$FEATURES" ] && CHANGELOG+="### Features"$'\n'"${FEATURES}"$'\n'
          [ -n "$FIXES" ] && CHANGELOG+="### Bug Fixes"$'\n'"${FIXES}"$'\n'
          [ -n "$OTHER" ] && CHANGELOG+="### Other Changes"$'\n'"${OTHER}"$'\n'

          {
            echo "body<<CHANGELOG_EOF"
            echo "$CHANGELOG"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Collect the built binaries
        if: needs.version.outputs.skip == 'false'
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Create tag
        id: tag
        if: needs.version.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Only the package version, which is the first version key in the manifest
          sed -i "0,/^version = /s/^version = .*/version = \"${VERSION#v}\"/" Cargo.toml
          # The lock carries the package version too, and cargo rewrites it on the next build
          sed -i "/^name = \"passbox\"$/{n;s/^version = .*/version = \"${VERSION#v}\"/}" Cargo.lock
          git add Cargo.toml Cargo.lock
          # The first release computes the version the manifest already carries
          git diff --cached --quiet || git commit -m "chore: bump version to ${VERSION}"

          git tag -a "$VERSION" -m "$VERSION"
          git push origin main "$VERSION"
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      # releases/latest/download/passbox.alfredworkflow then always installs the newest one
      - name: Build the Alfred workflow
        if: needs.version.outputs.skip == 'false'
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: integrations/alfred/build.sh "$VERSION" artifacts/passbox.alfredworkflow

      - name: Create release with the binaries attached
        if: needs.version.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
          # Through the environment, since the body is built from commit subjects
          CHANGELOG: ${{ steps.changelog.outputs.body }}
        run: |
          ls -l artifacts
          gh release create "$VERSION" --title "$VERSION" --notes "$CHANGELOG" \
            artifacts/*.tar.gz artifacts/passbox.alfredworkflow

      # The docs describe this release, so they go out after it and are built from its tag
      - name: Publish the docs for this release
        if: needs.version.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main -f ref="$VERSION"

      - name: Update Homebrew formula
        if: needs.version.outputs.skip == 'false'
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          TAP_REPO="gabrielkoerich/homebrew-tap"
          if [ -z "${TAP_TOKEN}" ]; then
            echo "::warning::HOMEBREW_TAP_TOKEN is not set, skipping the ${TAP_REPO} update"
            exit 0
          fi

          base="https://github.com/${REPO}/releases/download/${VERSION}"
          cp Formula/passbox.rb formula.rb
          sed -i "s|^  version \"0.0.0\"|  version \"${VERSION#v}\"|" formula.rb

          # Each platform gets the archive built for it, with the checksum of that archive
          for pair in \
            "MACOS_ARM:aarch64-apple-darwin" \
            "LINUX:x86_64-unknown-linux-musl"; do
            key="${pair%%:*}"; target="${pair#*:}"
            file="artifacts/passbox-${target}.tar.gz"
            [ -f "$file" ] || { echo "::error::missing $file"; exit 1; }
            sum=$(sha256sum "$file" | awk '{print $1}')
            sed -i "s|URL_${key}|${base}/passbox-${target}.tar.gz|" formula.rb
            sed -i "s|SHA_${key}|${sum}|" formula.rb
          done

          grep -q 'URL_\|SHA_' formula.rb && { echo "::error::a placeholder was left behind"; exit 1; }

          git clone "https://x-access-token:${TAP_TOKEN}@github.com/${TAP_REPO}.git" tap-repo
          mkdir -p tap-repo/Formula
          cp formula.rb tap-repo/Formula/passbox.rb

          git -C tap-repo config user.name "github-actions[bot]"
          git -C tap-repo config user.email "github-actions[bot]@users.noreply.github.com"
          git -C tap-repo add Formula/passbox.rb
          if git -C tap-repo diff --cached --quiet; then
            echo "Homebrew formula unchanged"
            exit 0
          fi
          git -C tap-repo commit -m "chore: update passbox formula for ${VERSION}"
          git -C tap-repo push origin main

      # A tag with no release behind it is worse than no tag: `git describe` sees it, so every
      # later run computes a version already taken and the release line stalls until it is cut
      # away by hand. That happened once, so failing now takes the tag back with it.
      - name: Take the tag back if the release did not finish
        if: failure() && steps.tag.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          echo "release failed after tagging, removing $VERSION"
          gh release delete "$VERSION" --yes --cleanup-tag 2>/dev/null || true
          git push origin ":refs/tags/$VERSION" 2>/dev/null || true
          git tag -d "$VERSION" 2>/dev/null || true

      # Last, so a failed publish cannot take back a release that already shipped
      - name: Publish to crates.io
        if: needs.version.outputs.skip == 'false'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "${CARGO_REGISTRY_TOKEN}" ]; then
            echo "::warning::CARGO_REGISTRY_TOKEN is not set, skipping crates.io"
            exit 0
          fi
          # The default build needs swiftc, which this Linux runner lacks
          cargo publish --locked --no-default-features
