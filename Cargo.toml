[package]
name = "passbox"
version = "2.0.8"
edition = "2024"
description = "A password store for agents, where a fingerprint releases one secret into one process"
license = "MIT"
repository = "https://github.com/gabrielkoerich/passbox"
homepage = "https://passbox.gabrielkoerich.com"
readme = "README.md"
keywords = ["secrets", "password", "agents", "touch-id"]
categories = ["authentication", "command-line-utilities"]
include = ["/src/**", "/plugins/**", "/swift/**", "/build.rs", "/README.md", "/LICENSE"]

[features]
# The host holds the Enclave, the store and the broker. A client only asks one.
default = ["host"]
host = []
# Tests only. Swaps the Secure Enclave helper for src/bin/fake-enclave.rs, and a release build
# with it does not compile. Never enable it for anything that ships.
mock-enclave = ["host"]

[[bin]]
name = "fake-enclave"
path = "src/bin/fake-enclave.rs"
required-features = ["mock-enclave"]

[dependencies]
# `plugin` is back for the YubiKey wrap alone. It carries no prompt wording of its own,
# so it cannot take over the Touch ID text, which is why it was dropped before.
age = { version = "0.12.1", features = ["plugin", "cli-common"] }
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
hex = "0.4.3"
libc = "0.2.180"
rand = "0.10.3"
rpassword = "7.4.0"
secrecy = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
signature = "2.2.0"
# Ed25519 and P-256 only. RSA would pull in the `rsa` crate for a key type few still make
ssh-key = { version = "0.6.7", default-features = false, features = ["std", "ed25519", "p256"] }
toml = "0.9.8"
zeroize = "1.9.0"

[dev-dependencies]
tempfile = "3.24.0"
